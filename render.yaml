services:
  - type: web
    name: bharatfiling
    env: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Secrets are generated by Render and never stored in git
      - key: JWT_SECRET
        generateValue: true
      - key: OTP_PEPPER
        generateValue: true
      # Comma-separated browser origins allowed to call the API (no wildcard), e.g. https://bharatfiling.com
      - key: CORS_ORIGIN
        value: https://bharatfiling.onrender.com,http://localhost:3000,http://localhost:5173
      # Firebase web API key used to verify phone-OTP ID tokens
      - key: FIREBASE_API_KEY
        sync: false
      # Provider secrets: set these in the Render dashboard
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
